        "acceptedAnswer": {
          "@type": "Answer",

        "@type": "Question",
        "name": "Is Days on Purpose a medical prediction?",

  <style>
    :root { --accent:#2fb8a4; --on-accent:#0f1214; --bg:#0f1214; --card:#15191b; --panel:#1b2022; --hairline:#2a3032; --field-border:#667377; --text:#f5f7f8; --muted:#a3adb0; --danger:#f87171; color-scheme: dark; font-family: system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif; }
    @media (prefers-color-scheme: light) {
      :root { --accent:#177a6c; --on-accent:#ffffff; --bg:#f5f7f9; --card:#ffffff; --panel:#eef2f3; --hairline:#d5dcde; --field-border:#7d8a8e; --text:#182022; --muted:#4f5b5f; --danger:#b42318; color-scheme: light; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); -webkit-font-smoothing: antialiased; }
  main { max-width:720px; margin:0 auto; padding:1rem 1rem 2.25rem; line-height:1.5; }
  header { margin-bottom:1.1rem; }
    h1 { margin:0; font-size:clamp(1.9rem,4vw,2.6rem); }
    header p.tag { margin:.55rem 0 0; font-size:1.05rem; color:var(--muted); }
  form { display:grid; gap:.85rem; margin-bottom:1.4rem; }
    #form-desc { margin:0; font-size:.9rem; color:var(--muted); }
    .field { display:grid; gap:.25rem; }
    label { font-weight:500; }
  input[type=date], select { background:var(--panel); border:1px solid var(--field-border); border-radius:.55rem; padding:.65rem .8rem; color:inherit; font-size:1rem; }
    input:focus, select:focus, button:focus { outline:2px solid var(--accent); outline-offset:2px; }
    button { font:inherit; }
    .error { color:var(--danger); font-size:.9rem; }
    .calc-btn { background:var(--accent); color:var(--on-accent); border:none; padding:.85rem 1.2rem; font-size:1rem; font-weight:600; border-radius:.65rem; cursor:pointer; transition:background .2s, filter .2s; }
    .calc-btn[disabled] { opacity:.55; cursor:not-allowed; }
    .calc-btn:not([disabled]):hover { filter:brightness(1.08); }
    .calc-btn:not([disabled]):active { filter:brightness(.93); }
    #result-region:focus { outline:2px solid var(--accent); outline-offset:3px; }
  .result-card { display:grid; gap:1.4rem; padding:1.75rem 1.6rem 1.9rem; border:1px solid var(--accent); border-radius:1rem; background:var(--card); }
    .result-head h2 { margin:0 0 .4rem; font-size:2.15rem; line-height:1.15; }
    .result-head p { margin:0; color:var(--muted); font-size:1.1rem; }
    .stats { display:grid; gap:1.25rem; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); }
  .stat { background:var(--panel); border:1px solid var(--hairline); border-radius:1.1rem; padding:.85rem .85rem .8rem; display:grid; gap:.4rem; min-width:140px; }
    .stat .label { font-size:.72rem; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
    .stat .value { font-size:2.25rem; line-height:1; color:var(--accent); font-weight:600; letter-spacing:.5px; font-variant-numeric:tabular-nums; }
    .stat .precise { font-size:.72rem; color:var(--muted); }
  .message { margin:0; font-size:1.25rem; line-height:1.35; max-width:60ch; }
    .countdown { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:center; gap:.35rem .5rem; background:var(--panel); border:1px solid var(--hairline); border-radius:.9rem; padding:1rem .75rem .85rem; font-variant-numeric:tabular-nums; }
    .cd-cell { display:grid; justify-items:center; gap:.2rem; min-width:3.2rem; }
    .cd-val { font-size:1.85rem; line-height:1; color:var(--accent); font-weight:600; letter-spacing:.5px; }
    .cd-lbl { font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
    .cd-sep { font-size:1.6rem; line-height:1; color:var(--muted); align-self:center; padding-bottom:1rem; }
    .cd-total { display:grid; justify-items:center; gap:.25rem; margin-top:.1rem; background:var(--panel); border:1px solid var(--hairline); border-radius:.9rem; padding:.85rem .75rem; font-variant-numeric:tabular-nums; }

    @media (max-width:520px){ .cd-val { font-size:1.45rem; } .cd-cell { min-width:2.5rem; } .cd-sep { font-size:1.3rem; padding-bottom:.85rem; } .cd-total-val { font-size:1.65rem; } }
    .note { font-size:.72rem; color:var(--muted); margin-top:.5rem; line-height:1.35; }
    .country-select { max-height:14rem; overflow:auto; }
    @media (max-width:640px){
      .result-card { padding:1.6rem 1.3rem 1.9rem; gap:1.4rem; }
      .result-head h2 { font-size:1.75rem; }
      .stats { gap:1rem; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); }
      .stat { padding:.95rem .9rem .9rem; }
      .stat .value { font-size:1.95rem; }
      .message { font-size:1.15rem; }
    }
  footer { margin-top:2rem; font-size:.7rem; color:var(--muted); line-height:1.3; }

<body>
<main>
  <header>
    <h1>Days on Purpose</h1>
    <p class="tag">Turn time into meaningful action.</p>
  </header>
  <form id="calculator-form" aria-describedby="form-desc">
    <p id="form-desc">Enter your details to estimate your purpose days. Statistical averages—never a prediction.</p>
    <div class="field">
      <label for="birthDate">Birth Date</label>
      <input id="birthDate" name="birthDate" type="date" required data-testid="input-birthdate" />
    </div>
    <div class="field">
      <label for="country">Country</label>
  <select id="country" name="country" data-testid="input-country" size="1" class="country-select"></select>
    </div>
    <div class="field">
      <label for="gender">Gender</label>
      <select id="gender" name="gender" data-testid="input-gender">
        <option value="male">male</option>
        <option value="female">female</option>
      </select>
    </div>
    <div id="error" class="error" role="alert" hidden></div>
    <button id="calc-btn" class="calc-btn" data-testid="button-calc" type="submit" disabled>Calculate</button>
  </form>

  <section id="result-region" aria-live="polite" aria-atomic="true" tabindex="-1"></section>

  <footer>
    <p>Disclaimer: Statistical estimate, not an individual prediction.</p>
    <p>© 2025–<span id="year">2025</span> Richard Crane. Licensed under PolyForm Strict 1.0.0.</p>
  </footer>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
